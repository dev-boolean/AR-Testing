<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Menú AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#111;color:white}
    .hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
    h1{font-size:42px;margin:0 0 10px}.card{width:min(520px,100%);background:#222;border-radius:24px;padding:18px}
    model-viewer{width:100%;height:55vh;min-height:360px;background:#181818;border-radius:18px}
    .btn{display:inline-block;margin-top:16px;padding:15px 22px;border-radius:14px;background:white;color:#111;text-decoration:none;font-weight:700}
    p{color:#bbb}.price{font-size:24px;font-weight:700}
  </style>
</head>
<body>
<div class="hero">
  <div class="card">
    <h1 id="name">🍔 Hamburguesa AR</h1>
    <p id="description">Modelo 3D de demostración. En un teléfono compatible puedes abrir la experiencia AR.</p>
    <model-viewer
      src="models/hamburguer.glb"
      alt="Hamburguesa en 3D"
      camera-controls
      auto-rotate
      ar
      ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="1"
      exposure="1">
    </model-viewer>
    <div class="price">$25.000 COP</div>
    <a class="btn" href="https://modelviewer.dev/" target="_blank">Información AR</a>
  </div>
</div>
</body>
</html>
